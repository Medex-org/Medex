name: Deploy Website to GitHub Pages

on:
  push:
    branches: ["shanmuka"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fix package manager conflicts
        run: |
          rm -f package-lock.json
          npm pkg delete packageManager || true
          npm pkg delete scripts.preinstall || true

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build website
        # Using the exact path filter format for pnpm
        run: pnpm --filter "./apps/website" build

      - name: Debug Output Directory
        # This will print the contents of your website folder to the logs!
        run: ls -la apps/website

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # If your app builds to a folder named "build" instead of "dist", change this line!
          path: './apps/website/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
