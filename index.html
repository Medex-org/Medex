<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Stamp the theme class before first paint so there's no
      // light-to-dark flash on load - mirrors next-themes' own logic.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEDX R&amp;Ed | Clinical Research &amp; Medical Education</title>
    <meta name="description" content="MEDX R&amp;Ed advances clinical research education, medical exchange, and technology for global health. Join our global student-led mission." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://medxred.org/" />

    <!-- Open Graph - this file's tags cover "/"; scripts/generate-static-meta.mjs
         stamps a copy of this document per route (src/data/seo.json) with these
         swapped out, since crawlers don't run the client-side PageMeta update. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://medxred.org/" />
    <meta property="og:title" content="MEDX R&amp;Ed | Clinical Research &amp; Medical Education" />
    <meta property="og:description" content="MEDX R&amp;Ed advances clinical research education, medical exchange, and technology for global health. Join our global student-led mission." />
    <meta property="og:site_name" content="MEDX R&amp;Ed" />
    <meta property="og:image" content="https://medxred.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MEDX R&amp;Ed | Clinical Research &amp; Medical Education" />
    <meta name="twitter:description" content="MEDX R&amp;Ed advances clinical research education, medical exchange, and technology for global health. Join our global student-led mission." />
    <meta name="twitter:image" content="https://medxred.org/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Fonts are self-hosted (see src/index.css @font-face rules) rather than
         loaded from fonts.googleapis.com, so there's no second render-blocking
         origin to connect to. Preload the body font so it's discovered
         immediately instead of only after the stylesheet parses. -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Organization schema is shared by every page. BreadcrumbList schema is
         injected per route by scripts/generate-static-meta.mjs at build time. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NGO",
        "@id": "https://medxred.org/#organization",
        "name": "MEDX R&Ed",
        "alternateName": ["MedX R&ED", "MedX Red", "MEDX R&ED", "MEDX Research & Education", "MEDX Research and Education", "MedxRed"],
        "url": "https://medxred.org/",
        "logo": "https://medxred.org/logo.png",
        "image": "https://medxred.org/og-image.png",
        "description": "International organization advancing clinical research education and medical exchange programs.",
        "foundingDate": "2024",
        "email": "connect@medx.org",
        "areaServed": [
          { "@type": "Country", "name": "Pakistan" },
          { "@type": "Country", "name": "United States" },
          { "@type": "Country", "name": "India" },
          { "@type": "Country", "name": "United Kingdom" }
        ],
        "knowsAbout": ["Clinical Research", "Medical Education", "Global Health", "Medical Exchange"],
        "sameAs": [
          "https://www.linkedin.com/company/medx-medical-exchange-research-and-education",
          "https://www.instagram.com/medxresearch_education",
          "https://chat.whatsapp.com/Gxqcdg1itm1La2Yt2d1EdO"
        ]
      }
    </script>
    <!-- SEO_JSON_LD -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
