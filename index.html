<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Stamp the theme class before first paint so there's no
      // light-to-dark flash on load - mirrors next-themes' own logic.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEDX R&amp;Ed - Medical Exchange, Research &amp; Education</title>
    <meta name="description" content="A global community of medical and health-science students united by rigorous methodology, cross-border mentorship, and the pursuit of evidence-based medicine." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://medxresearch.org/" />

    <!-- Open Graph - this file's tags cover "/"; scripts/generate-static-meta.mjs
         stamps a copy of this document per route (src/data/seo.json) with these
         swapped out, since crawlers don't run the client-side PageMeta update. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://medxresearch.org/" />
    <meta property="og:title" content="MEDX R&amp;Ed - Medical Exchange, Research &amp; Education" />
    <meta property="og:description" content="A global community of medical and health-science students united by rigorous methodology, cross-border mentorship, and the pursuit of evidence-based medicine." />
    <meta property="og:site_name" content="MEDX R&amp;Ed" />
    <meta property="og:image" content="https://medxresearch.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MEDX R&amp;Ed - Medical Exchange, Research &amp; Education" />
    <meta name="twitter:description" content="A global community of medical and health-science students united by rigorous methodology, cross-border mentorship, and the pursuit of evidence-based medicine." />
    <meta name="twitter:image" content="https://medxresearch.org/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/medx-logo.png" />

    <!-- Fonts are self-hosted (see src/index.css @font-face rules) rather than
         loaded from fonts.googleapis.com, so there's no second render-blocking
         origin to connect to. Preload the body font so it's discovered
         immediately instead of only after the stylesheet parses. -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
